<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!--
      Voice engine (hidden window). onnxruntime-web needs 'wasm-unsafe-eval' (WebAssembly compilation), the
      VAD AudioWorklet and dynamically imported WASM glue are same-origin scripts, Whisper runs in a module
      worker that spawns its own (blob or same-origin) threads. The sha256 source is @vitejs/plugin-react's
      dev-only inline preamble (absent from production builds).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' blob: 'sha256-Z2/iFzh9VMlVkEOar1f/oSHWwQk3ve1qk/C2WdsC4Xk='; worker-src 'self' blob:; connect-src 'self' blob: data:; media-src 'self' blob: data: mediastream:; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <title>Jarvis — голосовой движок</title>
    <style>
      html,
      body {
        margin: 0;
        background: #05080d;
        color: #9fe9ff;
        font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      #status {
        margin: 0;
        padding: 12px 14px;
        white-space: pre-wrap;
        word-break: break-word;
      }
    </style>
  </head>
  <body>
    <pre id="status">Jarvis — голосовой движок</pre>
    <script type="module" src="./src/voice/main.ts"></script>
  </body>
</html>
