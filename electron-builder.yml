# Jarvis — electron-builder configuration (macOS dmg/zip, Windows NSIS).
#   npm run dist:mac   → release/Jarvis-<ver>-mac-arm64.dmg|zip, release/Jarvis-<ver>-mac-x64.dmg|zip
#   npm run dist:win   → release/Jarvis-Setup-<ver>-win-x64.exe
# Icons and installer artwork are generated by scripts/gen-icons.mjs (npm run assets); electron-builder
# picks up build/background(@2x).png (DMG window) and build/installerSidebar.bmp (NSIS) by file name.
appId: com.pomoshnik.jarvis # also the Windows AppUserModelID of the shortcuts — do not change after release
productName: Jarvis
copyright: Copyright © 2026 Jarvis
directories:
  buildResources: build
  output: release

# Vite bundles main, preload and renderers into out/ (no runtime node_modules).
# out/renderer contains the public assets the voice engine needs offline:
# VAD (Silero) worklet + onnx, onnxruntime-web wasm, local Whisper model files.
files:
  - package.json
  - out/**/*
  - '!**/*.map'
  - '!**/.DS_Store'
asar: true
npmRebuild: false
nodeGypRebuild: false
buildDependenciesFromSource: false
# Keep only the Chromium locales the UI needs (Russian + English) — smaller app.
electronLanguages:
  - ru
  - en
# Tray / menu-bar icons → <resources>/tray (process.resourcesPath + '/tray' at runtime).
extraResources:
  - from: resources/tray
    to: tray
    filter:
      - '**/*'
# Harden the Electron binary: the app holds microphone / screen / accessibility permissions,
# so it must not be usable as a generic Node.js runtime (ELECTRON_RUN_AS_NODE, --inspect, NODE_OPTIONS).
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableCookieEncryption: true
# No auto-update server.
publish: null

mac:
  category: public.app-category.productivity
  icon: build/icon.icns
  # Architectures come from the CLI: npm run dist:mac passes --arm64 --x64 (no flag = the host arch).
  target:
    - dmg
    - zip
  # No Apple Developer ID: ad-hoc signature (required to run on Apple Silicon).
  # First launch: right-click the app → «Открыть» (see README).
  identity: '-'
  hardenedRuntime: false
  gatekeeperAssess: false
  notarize: false
  darkModeSupport: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: Джарвису нужен микрофон, чтобы слышать слово «Джарвис» и ваши голосовые команды.
    NSAppleEventsUsageDescription: Джарвис управляет приложениями (открыть, закрыть, громкость, музыка) по вашим командам.
    NSScreenCaptureUsageDescription: Джарвис делает снимок экрана, когда вы просите посмотреть на экран или ответить на вопросы теста.
    NSAccessibilityUsageDescription: Джарвис нажимает клавиши, вводит текст и управляет мышью по вашим командам.
    NSDesktopFolderUsageDescription: Джарвис открывает и читает файлы на Рабочем столе, когда вы его об этом просите.
    NSDocumentsFolderUsageDescription: Джарвис открывает и читает файлы в папке «Документы», когда вы его об этом просите.
    NSDownloadsFolderUsageDescription: Джарвис открывает и читает файлы в папке «Загрузки», когда вы его об этом просите.
    # Electron ships generic English strings for these; Jarvis does not use them on its own.
    NSAudioCaptureUsageDescription: Джарвис использует системный звук только для функций, о которых вы его попросите.
    NSCameraUsageDescription: Джарвис использует камеру только для функций, о которых вы его попросите.
    NSBluetoothAlwaysUsageDescription: Джарвис использует Bluetooth только для функций, о которых вы его попросите.
    NSBluetoothPeripheralUsageDescription: Джарвис использует Bluetooth только для функций, о которых вы его попросите.
    LSMultipleInstancesProhibited: true
  artifactName: Jarvis-${version}-mac-${arch}.${ext}

dmg:
  title: Jarvis ${version}
  writeUpdateInfo: false

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
  # Not code-signed (no certificate): the exe icon and version info are still written (signAndEditExecutable default).
  artifactName: Jarvis-Setup-${version}-win-${arch}.${ext}

nsis:
  oneClick: false # assisted installer: welcome → install mode → folder → progress → finish
  perMachine: false # per-user install by default (no admin rights needed)
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Jarvis
  uninstallDisplayName: Jarvis
  runAfterFinish: true
  deleteAppDataOnUninstall: false # chats and settings survive reinstall
  differentialPackage: false
  # Installer UI language follows Windows: Russian, otherwise English (first entry is the fallback).
  installerLanguages:
    - ru_RU
    - en_US
  multiLanguageInstaller: true
  include: build/installer.nsh
